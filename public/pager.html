<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caco Pager</title>
<link rel="icon" href="/caco.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #1a1a1a; color: #d4d4d4; font-family: -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }

.wrap { max-width: 820px; margin: 0 auto; padding: 16px 14px 64px; }

header { display: flex; justify-content: center; padding: 4px 0 14px; }

.spinner { width: 13px; height: 13px; border: 2px solid #444; border-top-color: #007acc; border-radius: 50%; flex-shrink: 0; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.conn { font-size: 12px; padding: 3px 9px; border-radius: 10px; background: #2a2a2a; color: #777; }
.conn.error { background: #4a2020; color: #e88; }

.card { background: #222; border: 1px solid #333; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.name { font-size: 17px; font-weight: 600; color: #eee; }
.when { font-size: 13px; color: #777; margin-left: auto; white-space: nowrap; }
.stale-note { font-size: 12px; color: #b95; margin-left: 8px; white-space: nowrap; }
.card.stale .option { opacity: 0.45; }
.cwd { font-size: 13px; color: #777; margin-bottom: 12px; word-break: break-all; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  text-align: left; width: 100%; cursor: pointer;
  background: #2b2b2b; color: #d4d4d4; border: 1px solid #3a3a3a; border-radius: 6px;
  padding: 14px 14px; font-size: 16px; font-family: inherit; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; transition: background 0.12s, border-color 0.12s;
}
.option:hover:not(:disabled) { background: #333; border-color: #007acc; }
.option:disabled { opacity: 0.5; cursor: default; }

/* The well borrows .option's metrics so it reads as one more item in the stack. */
.well-wrap { margin-top: 10px; }
.well {
  display: block; width: 100%; box-sizing: border-box;
  background: #262626; color: #d4d4d4; border: 1px solid #3a3a3a; border-radius: 6px;
  padding: 14px 14px; font-size: 16px; font-family: inherit; line-height: 1.5;
  resize: none; overflow: hidden;
}
.well::placeholder { color: #6e6e6e; }
.well:focus { outline: none; border-color: #007acc; }
.well:disabled { opacity: 0.5; }

.card-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.dismiss, .send { background: none; border: 1px solid #3a3a3a; color: #999; font-size: 14px; cursor: pointer; font-family: inherit; padding: 9px 16px; border-radius: 6px; }
.dismiss:hover:not(:disabled) { color: #bbb; text-decoration: underline; }
.dismiss:disabled, .send:disabled { opacity: 0.5; cursor: default; }
/* Right-aligned opposite Dismiss, and accented as the affirmative action. */
.send { margin-left: auto; color: #cfe6f5; border-color: #007acc; }
.send:hover:not(:disabled) { background: #123; }
.send[hidden] { display: none; }
/* Its own line: a long error between two buttons overflows a narrow screen. */
.card-msg { font-size: 14px; color: #d89; margin-top: 10px; }

.empty { text-align: center; color: #666; font-size: 15px; padding: 56px 0; }
.truncated { text-align: center; color: #777; font-size: 13px; padding: 8px 0; }
.running { margin-bottom: 18px; }
.run-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #2a2a2a; font-size: 15px; color: #bbb; }
.run-row:last-child { border-bottom: none; }
.run-name { word-break: break-word; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="conn" id="conn">connecting</span>
  </header>
  <div class="running" id="running"></div>
  <div id="board"></div>
</div>

<script>
(function () {
  'use strict';

  var WAIT_MS = 10000;
  var boardEl = document.getElementById('board');
  var runningEl = document.getElementById('running');
  var connEl = document.getElementById('conn');

  var lastVersion = null;
  var backoffMs = 1000;
  // Session ids with an action in flight or just completed. The board is a
  // moment-old view, so a card is hidden locally from the instant the user acts
  // until the server's snapshot catches up; otherwise it would linger — or be
  // rebuilt unlocked — and invite a double-send.
  var acted = Object.create(null);
  // In-progress text per session, so a board rebuild — which happens whenever ANY
  // session changes state — cannot destroy what the user is writing. Deliberately
  // NOT pruned like `acted`: that map is a suppression and must expire, whereas a
  // session briefly going busy from another client would otherwise delete text
  // this user is still typing. Cleared only when the user resolves the card.
  var drafts = Object.create(null);
  // A long-lived tab must not accumulate forever; key order tracks edit recency.
  var DRAFT_CAP = 20;
  // The board is not rebuilt while a well has focus, so a background refresh
  // cannot take the caret or the mobile keyboard away mid-sentence. The newest
  // pending view waits here; the timer is the backstop that needs no event.
  var heldView = null;
  var holdTimer = null;
  var MAX_HOLD_MS = 60000;

  function setDraft(sessionId, text) {
    delete drafts[sessionId];
    if (!text) return;
    drafts[sessionId] = text;
    var keys = Object.keys(drafts);
    if (keys.length > DRAFT_CAP) delete drafts[keys[0]];
  }

  function clearDraft(sessionId) {
    delete drafts[sessionId];
  }

  function setConn(text, isError) {
    connEl.textContent = text;
    connEl.className = isError ? 'conn error' : 'conn';
  }

  function relTime(iso) {
    if (!iso) return '';
    var secs = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (!isFinite(secs)) return '';
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
  }

  // Every insertion below is textContent or createTextNode. Model-authored text
  // (session names, option text) must never reach an HTML sink.
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    }).then(function (res) {
      if (res.ok) return null;
      return res.json().catch(function () { return {}; }).then(function (data) {
        var err = new Error(data.error || ('HTTP ' + res.status));
        err.status = res.status;
        throw err;
      });
    });
  }

  function renderCard(entry) {
    var card = el('div', 'card');
    // Card identity, so a rebuild can recognize the card holding the caret and
    // leave it standing rather than matching on position or name.
    card.setAttribute('data-session', entry.sessionId);
    // The offer these buttons were built from. A kept card is not rebuilt, so
    // this is how a later render notices its options no longer match the server.
    card.setAttribute('data-offer', (entry.options || []).join('\u0000'));

    var head = el('div', 'card-head');
    head.appendChild(el('span', 'name', entry.name || entry.sessionId.slice(0, 8)));
    head.appendChild(el('span', 'when', relTime(entry.idleAt)));
    card.appendChild(head);

    if (entry.cwd) card.appendChild(el('div', 'cwd', entry.cwd));

    var msg = el('span', 'card-msg', '');
    var buttons = [];

    function lock(disabled) {
      buttons.forEach(function (b) { b.disabled = disabled; });
    }

    // One path for every way of sending, because an option click and a Send are
    // the same act with a different string. Bound to this card's own session id
    // and to its own text, captured in the closure — never re-read from the DOM
    // or from a list index, so a re-render between paint and click cannot
    // retarget it.
    function submit(text) {
      msg.textContent = '';
      lock(true);
      // Suppress at initiation, not on resolution. A rebuild during the in-flight
      // window would otherwise hand back a fresh card that never saw lock(true) —
      // unlocked, draft intact — and a second tap would deliver the message twice.
      // Releasing the board hold on blur makes that rebuild the common case
      // rather than a race.
      acted[entry.sessionId] = true;
      post('/api/sessions/' + encodeURIComponent(entry.sessionId) + '/messages', { prompt: text })
        .then(function () {
          // The send makes the session busy, which bumps the version and wakes
          // the parked poll on its own; hide the card now so it cannot be
          // clicked twice in the gap.
          clearDraft(entry.sessionId);
          card.remove();
        })
        .catch(function (err) {
          if (err.status === 409 || err.status === 404) {
            // Already busy, or gone: either way it does not belong on the
            // board. Remove it rather than promising a refresh — 409 raises no
            // bump of its own, so nothing would arrive to clear it. The draft
            // stays: the message was NOT delivered, so discarding the text here
            // would destroy typing over something the user did not do.
            card.remove();
            return;
          }
          // Nothing was sent, so the card belongs back on the board with its
          // text; lift the suppression or the next render would drop it.
          delete acted[entry.sessionId];
          lock(false);
          msg.textContent = 'Send failed: ' + err.message;
        });
    }

    var options = el('div', 'options');
    // Assigned below, once the well exists. An option click STAGES its text into
    // this card's own well rather than sending (spec-offer-action-stage): the
    // offer is a suggestion, so the user gets a second, deliberate act — and on a
    // phone a mis-tap no longer dispatches a turn.
    var stage = null;
    (entry.options || []).forEach(function (optionText) {
      var btn = el('button', 'option', optionText);
      btn.type = 'button';
      buttons.push(btn);
      btn.addEventListener('click', function () {
        if (stage) stage(optionText);
      });
      options.appendChild(btn);
    });
    card.appendChild(options);

    var foot = el('div', 'card-foot');
    var send = el('button', 'send', 'Send');
    send.type = 'button';

    // The well is defensive about entry.options: the server only ever lists a
    // session holding an offer, so a card without options cannot reach the board.
    if ((entry.options || []).length > 0) {
      var wrap = el('div', 'well-wrap');
      var well = el('textarea', 'well');
      well.rows = 1;
      well.placeholder = 'something else \u2026';
      well.setAttribute('aria-label', 'Send something else to this session');
      buttons.push(well);

      function grow() {
        // jsdom and any pre-layout paint report 0 here; leave the height alone
        // rather than collapsing the control to nothing.
        well.style.height = 'auto';
        if (well.scrollHeight > 0) well.style.height = well.scrollHeight + 'px';
      }

      function syncSend() {
        send.hidden = well.value.trim().length === 0;
      }

      well.value = drafts[entry.sessionId] || '';
      syncSend();
      // A restored draft must be grown too: rebuilds are frequent and unattended,
      // so without this a multi-line message reappears clipped to one row and
      // reads as lost even though the text is intact.
      grow();

      well.addEventListener('input', function () {
        setDraft(entry.sessionId, well.value);
        syncSend();
        grow();
      });

      // Staging goes through the SAME path as typing — draft map, Send
      // visibility, auto-grow — so a staged option is indistinguishable from
      // typed text downstream and survives the frequent board rebuilds.
      // Focus is load-bearing, not a nicety: the board hold is a predicate over
      // document.activeElement, and a click on a button focuses nothing, so
      // without this the board could rebuild while the user is deciding.
      stage = function (optionText) {
        well.value = optionText;
        setDraft(entry.sessionId, optionText);
        syncSend();
        grow();
        well.focus();
        if (well.setSelectionRange) well.setSelectionRange(optionText.length, optionText.length);
      };

      send.addEventListener('click', function () {
        var text = well.value.trim();
        if (!text) return;
        submit(text);
      });

      wrap.appendChild(well);
      card.appendChild(wrap);
    } else {
      send.hidden = true;
    }

    var dismiss = el('button', 'dismiss', 'Dismiss');
    dismiss.type = 'button';
    buttons.push(dismiss);
    buttons.push(send);
    dismiss.addEventListener('click', function () {
      msg.textContent = '';
      lock(true);
      acted[entry.sessionId] = true;
      post('/api/sessions/' + encodeURIComponent(entry.sessionId) + '/pager-dismiss')
        .then(function () {
          // The dismissal bumps the version, so the parked poll refreshes itself.
          clearDraft(entry.sessionId);
          card.remove();
        })
        .catch(function (err) {
          delete acted[entry.sessionId];
          lock(false);
          msg.textContent = 'Dismiss failed: ' + err.message;
        });
    });
    foot.appendChild(dismiss);
    foot.appendChild(send);
    card.appendChild(foot);
    card.appendChild(msg);

    return card;
  }

  function renderRunning(view) {
    // One row per running session, each with its own throbber. A count answers
    // "how many" when the useful question is "which one", and names joined onto a
    // single line were unreadable on a phone. Server-ordered, so rows do not
    // reshuffle between polls. Always runs, even while the board is held, so the
    // page never looks frozen.
    var running = view.busy || [];
    runningEl.textContent = '';
    running.forEach(function (b) {
      var row = el('div', 'run-row');
      row.appendChild(el('span', 'spinner'));
      row.appendChild(el('span', 'run-name', b.name || b.sessionId.slice(0, 8)));
      runningEl.appendChild(row);
    });
  }

  function renderBoard(view) {
    var waiting = (view.waiting || []).filter(function (w) { return !acted[w.sessionId]; });

    // Drop stale local suppressions once the server agrees the session is gone
    // from the board, so acting on it again later still works. Lives here rather
    // than beside the running rows so it stays in lockstep with what is actually
    // drawn: pruning against a view whose cards were never rendered would
    // un-suppress a card that then reappears on the next rebuild.
    var present = Object.create(null);
    (view.waiting || []).forEach(function (w) { present[w.sessionId] = true; });
    Object.keys(acted).forEach(function (id) { if (!present[id]) delete acted[id]; });

    // The card holding the caret is never torn down. Restoring text into a fresh
    // textarea is not enough: removing the focused node blurs it, and on a phone
    // the keyboard stays up over a node no longer in the document, so everything
    // typed after that lands nowhere and is lost without a trace. The hold above
    // makes this rare; the backstop and any missed focus check make it possible,
    // so the rebuild itself has to be non-destructive rather than merely
    // infrequent. The node is kept in place and never re-appended, because moving
    // an element is a remove-and-insert and blurs it just the same.
    var keep = null;
    var keepId = null;
    var focused = document.activeElement;
    if (focused && focused.classList && focused.classList.contains('well') && boardEl.contains(focused)) {
      keep = focused.parentNode;
      while (keep && keep !== boardEl && !(keep.classList && keep.classList.contains('card'))) {
        keep = keep.parentNode;
      }
      if (keep === boardEl) keep = null;
      if (keep) keepId = keep.getAttribute('data-session');
      // A card the user has already acted on is on its way out; keeping it would
      // hold a resolved session on the board and re-offer a second send.
      if (keepId && acted[keepId]) { keep = null; keepId = null; }
    }

    if (!keep) {
      boardEl.textContent = '';
      if (waiting.length === 0) {
        boardEl.appendChild(el('div', 'empty', (view.busy || []).length > 0
          ? 'Nothing waiting on you — work in progress.'
          : 'Nothing waiting on you.'));
        return;
      }
      waiting.forEach(function (entry) { boardEl.appendChild(renderCard(entry)); });
      if (view.waitingTruncated) {
        boardEl.appendChild(el('div', 'truncated', 'More sessions are waiting than shown.'));
      }
      return;
    }

    // Everything except the kept card goes; the kept one is left exactly where it
    // is and the rest are inserted around it, preserving server order.
    var child = boardEl.firstChild;
    while (child) {
      var next = child.nextSibling;
      if (child !== keep) boardEl.removeChild(child);
      child = next;
    }
    var seenKept = false;
    var keptMatched = false;
    waiting.forEach(function (entry) {
      if (entry.sessionId === keepId) { seenKept = true; keptMatched = true; refreshCard(keep, entry); return; }
      var node = renderCard(entry);
      if (seenKept) boardEl.appendChild(node);
      else boardEl.insertBefore(node, keep);
    });
    // The session left the board while its card held the caret. The card stays
    // so the text being written is not destroyed, but it no longer represents a
    // live offer, so it says so and stops offering options.
    if (!keptMatched) markStale(keep);
    if (view.waitingTruncated) {
      boardEl.appendChild(el('div', 'truncated', 'More sessions are waiting than shown.'));
    }
  }

  /**
   * Mark a kept card as no longer matching a live offer: its option buttons stop
   * being clickable and it says why.
   *
   * Staging a stale option would overwrite what the user is writing with text
   * from an offer the session has moved past — a wrong action, not merely an old
   * label. Typing and Send stay available throughout, because the user's own
   * words are valid regardless of what the offer says.
   */
  function markStale(card) {
    if (!card || card.classList.contains('stale')) return;
    card.classList.add('stale');
    var opts = card.querySelectorAll('.option');
    for (var i = 0; i < opts.length; i++) { opts[i].disabled = true; }
    var head = card.querySelector('.card-head');
    if (head && !card.querySelector('.stale-note')) {
      head.appendChild(el('span', 'stale-note', 'moved on'));
    }
  }

  /**
   * Update the display fields of a card that is being kept because it holds the
   * caret. Only the passive parts: a stale name or timestamp is the staleness the
   * hold's backstop exists to clear, whereas swapping the option buttons or the
   * textarea out from under someone mid-sentence is the harm it is trying to
   * avoid. Those refresh on the next full rebuild, once focus leaves.
   *
   * If the OFFER itself changed, the buttons are not merely old, they are wrong:
   * the card is marked stale instead of silently keeping them live.
   */
  function refreshCard(card, entry) {
    var name = card.querySelector('.name');
    if (name) name.textContent = entry.name || entry.sessionId.slice(0, 8);
    var when = card.querySelector('.when');
    if (when) when.textContent = relTime(entry.idleAt);
    var cwd = card.querySelector('.cwd');
    if (cwd && entry.cwd) cwd.textContent = entry.cwd;
    if (card.getAttribute('data-offer') !== (entry.options || []).join('\u0000')) markStale(card);
  }

  /**
   * Is the user typing into a card right now? A predicate over live DOM rather
   * than a flag set on focus and cleared on blur: a flag strands the board if the
   * focused node is removed, or if a mobile keyboard closes without firing blur.
   * Here a vanished node simply makes this false and the board rebuilds.
   */
  function boardIsHeld() {
    var a = document.activeElement;
    return !!a && a.classList && a.classList.contains('well') && boardEl.contains(a);
  }

  function applyHeld() {
    if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
    if (!heldView) return;
    var view = heldView;
    heldView = null;
    renderBoard(view);
  }

  function render(view) {
    renderRunning(view);
    if (boardIsHeld()) {
      // Latest wins, not a queue: every response is a complete snapshot, so an
      // older one is never worth applying.
      heldView = view;
      if (holdTimer === null) {
        holdTimer = setTimeout(function () {
          // Backstop for the case where no event ever arrives. Past a minute,
          // staleness is the worse failure — and the draft map means only the
          // caret and keyboard are lost here, never the text.
          holdTimer = null;
          applyHeld();
        }, MAX_HOLD_MS);
      }
      return;
    }
    heldView = null;
    if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
    renderBoard(view);
  }

  // Focus moving between two wells must not release the hold, and focusout fires
  // before the next element takes focus, so re-check once the move has settled.
  boardEl.addEventListener('focusout', function () {
    setTimeout(function () { if (!boardIsHeld()) applyHeld(); }, 0);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) applyHeld();
  });

  var polling = false;
  function poll(immediate) {
    if (polling) return;
    polling = true;

    var url = '/api/pager?wait=' + (immediate ? 0 : WAIT_MS);
    if (!immediate && lastVersion !== null) url += '&since=' + lastVersion;

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (view) {
        // A version we have already seen means the server answered without
        // parking — it sheds load past its waiter cap. Re-polling instantly then
        // would spin hardest exactly when the server is most loaded, so back off.
        var madeProgress = view.version !== lastVersion;
        lastVersion = view.version;
        backoffMs = 1000;
        setConn('live', false);
        render(view);
        polling = false;
        if (madeProgress || immediate) poll(false);
        else setTimeout(function () { poll(false); }, 1000);
      })
      .catch(function () {
        // The server may be restarting; back off rather than hammering it, and
        // say so instead of silently showing a frozen board.
        setConn('reconnecting', true);
        polling = false;
        setTimeout(function () { poll(true); }, backoffMs);
        backoffMs = Math.min(backoffMs * 2, 15000);
      });
  }

  poll(true);
})();
</script>
</body>
</html>
