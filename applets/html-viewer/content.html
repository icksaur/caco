<div class="html-viewer">
  <div class="hv-header">
    <a class="hv-path" id="filePath" title="Open in text editor">No file loaded</a>
    <span class="hv-actions">
      <a id="folderLink" class="hv-icon" title="Open folder in file finder" style="display:none">📁</a>
      <button id="refreshBtn" class="hv-icon" title="Refresh">↻</button>
    </span>
  </div>
  <iframe id="hvFrame" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" class="hv-frame"></iframe>
</div>
