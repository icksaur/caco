<div class="fe-root">
  <header class="fe-toolbar">
    <span class="fe-repo" id="feRepo">file-edits</span>
    <button class="fe-follow" id="feFollow" type="button" hidden>↓ Follow edits</button>
    <span class="fe-actions">
      <button class="fe-btn" id="feOpen" type="button" title="Open file in viewer">+</button>
    </span>
  </header>
  <div class="fe-tabs" id="feTabs"></div>
  <div class="fe-pane" id="fePane" tabindex="-1">
    <div class="fe-pane-empty" id="fePaneEmpty">No files open. Click + to open one, or wait for edits.</div>
    <div class="fe-pane-empty" id="feNotGit" hidden>Not a git repo — file-edits requires git.</div>
  </div>
</div>
