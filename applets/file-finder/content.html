<div class="file-finder">
  <div class="breadcrumb-row">
    <div class="breadcrumb" id="breadcrumb"></div>
    <a class="git-link hidden" id="gitLink" title="Git status">git</a>
  </div>
  <div class="finder-header">
    <input type="text" class="search-input" id="searchInput" placeholder="Search files..." autofocus>
    <button class="refresh-btn" id="refreshBtn" title="Refresh file list">↻</button>
  </div>
  <div class="results" id="results"></div>
  <div class="status" id="status"></div>
</div>
