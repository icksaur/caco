<div class="image-viewer">
  <div class="iv-toolbar">
    <span class="image-path" id="imagePath"></span>
    <span class="iv-controls">
      <button class="iv-btn" id="ivZoomOut" title="Zoom out">−</button>
      <span class="iv-zoom-label" id="ivZoomLabel">100%</span>
      <button class="iv-btn" id="ivZoomIn" title="Zoom in">+</button>
      <button class="iv-btn" id="ivZoomReset" title="Reset zoom">=</button>
      <a class="iv-btn" id="ivGallery" title="Gallery" style="display:none">📁</a>
      <button class="iv-btn" id="ivRefresh" title="Refresh">↻</button>
    </span>
  </div>
  <div class="image-container" id="imageContainer">
    <div class="no-image">No image specified.<br><br>Use: ?applet=image-viewer&path=image.jpg</div>
  </div>
</div>
