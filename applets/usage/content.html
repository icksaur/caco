<div class="usage-container">
  <div class="usage-header">
    <h1 class="usage-title">Usage</h1>
    <span id="usage-summary" class="usage-summary"></span>
    <button id="usage-refresh" class="usage-refresh" title="Refresh">Refresh</button>
  </div>

  <div id="usage-loading" class="usage-status">Loading usage…</div>
  <div id="usage-error" class="usage-status usage-error" style="display: none;"></div>
  <div id="usage-empty" class="usage-status" style="display: none;">No usage recorded in this window.</div>

  <div id="usage-chart-wrap" class="usage-chart-wrap" style="display: none;">
    <div class="usage-chart-caption">Credits per hour · past 7 days</div>
    <div id="usage-chart" class="usage-chart"></div>
  </div>
</div>
