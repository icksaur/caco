<div class="jobs-container">

    <button onclick="refreshJobs()" class="refresh-btn" title="Refresh">🔄</button>
  </div>
  
  <div id="loading" class="loading">Loading jobs...</div>
  <div id="error" class="error" style="display: none;"></div>
  <section id="wakes-section" class="wakes-section" style="display: none;">
    <h2 class="section-title">Session wakes</h2>
    <div id="wakes-list" class="jobs-list"></div>
  </section>
  <h2 id="jobs-title" class="section-title" style="display: none;">Slug schedules</h2>
  <div id="jobs-list" class="jobs-list"></div>

    <p>No scheduled jobs found</p>
  </div>
</div>
