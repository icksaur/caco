<div class="fe-root">
  <header class="fe-toolbar">
    <span class="fe-repo" id="feRepo">file-edits</span>
    <span class="fe-counts" id="feCounts">no changes</span>
    <button class="fe-btn" id="feOpen" title="Open file in viewer">+</button>
    <button class="fe-btn" id="feRefresh" title="Refresh">↻</button>
    <button class="fe-btn" id="feReset" title="Reset dismissals" hidden>Reset dismissals</button>
  </header>
  <div class="fe-empty" id="feEmpty">No file changes detected.</div>
  <div class="fe-not-git" id="feNotGit" hidden>Not a git repo — file-edits requires git for v1.</div>
  <div class="fe-stream" id="feStream"></div>
</div>
