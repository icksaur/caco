<div class="mem-container">
  <div class="mem-header">
    <h1 class="mem-title">Memories</h1>
    <span id="mem-count" class="mem-count"></span>
    <button id="mem-refresh" class="mem-refresh" title="Refresh">Refresh</button>
  </div>

  <div id="mem-loading" class="mem-status">Loading memories…</div>
  <div id="mem-error" class="mem-status mem-error" style="display: none;"></div>
  <div id="mem-list" class="mem-list"></div>
  <div id="mem-empty" class="mem-status" style="display: none;">No memories stored.</div>
</div>
