<div class="presentation">
  <div id="title" class="pres-title"></div>
  <div id="slideContainer" class="slide-container">
    <div id="slideContent" class="slide-content"></div>
  </div>
  <div id="nav" class="pres-nav">
    <button id="prevBtn" class="nav-btn" title="Previous slide (←)">◀ Prev</button>
    <span id="slideCounter" class="slide-counter"></span>
    <button id="nextBtn" class="nav-btn" title="Next slide (→)">Next ▶</button>
  </div>
  <div id="empty" class="empty-state">No presentation for this session</div>
</div>
